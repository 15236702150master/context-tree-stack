<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context Tree</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f5;
      --surface: #ffffff;
      --ink: #17201c;
      --muted: #68736e;
      --line: #d9dfdc;
      --green: #146c4c;
      --green-soft: #e3f1eb;
      --amber: #9a5a08;
      --amber-soft: #fff0d8;
      --coral: #b64b40;
      --focus: #1266a3;
      --radius: 7px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
    }
    button, input { font: inherit; letter-spacing: 0; }
    button:focus-visible, input:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 2px;
    }
    .app-header {
      height: 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .brand { display: flex; align-items: baseline; gap: 10px; }
    .brand h1 {
      margin: 0;
      font: 600 20px/1 "Bahnschrift", "Segoe UI", sans-serif;
    }
    .local-mark {
      color: var(--green);
      font: 600 11px/1 "Cascadia Code", Consolas, monospace;
      text-transform: uppercase;
    }
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      min-height: calc(100vh - 62px);
    }
    main { padding: 24px 28px 40px; min-width: 0; }
    aside {
      padding: 24px;
      background: var(--surface);
      border-left: 1px solid var(--line);
    }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .toolbar h2, aside h2 {
      margin: 0;
      font: 600 16px/1.3 "Bahnschrift", "Segoe UI", sans-serif;
    }
    .count { color: var(--muted); font-variant-numeric: tabular-nums; }
    .toolbar .spacer { flex: 1; }
    .search {
      width: min(280px, 38vw);
      height: 36px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 11px;
      background: var(--surface);
      color: var(--ink);
    }
    .command {
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid var(--ink);
      border-radius: var(--radius);
      background: var(--ink);
      color: white;
      cursor: pointer;
    }
    .command:hover { background: #2a3430; }
    .topic-list { border-top: 1px solid var(--line); }
    .topic-row {
      position: relative;
      display: grid;
      grid-template-columns: 24px minmax(170px, 0.85fr) minmax(220px, 1.5fr) auto;
      gap: 14px;
      align-items: center;
      min-height: 82px;
      padding: 13px 4px;
      border-bottom: 1px solid var(--line);
    }
    .rail {
      align-self: stretch;
      position: relative;
      display: flex;
      justify-content: center;
    }
    .rail::before {
      content: "";
      position: absolute;
      top: -14px;
      bottom: -14px;
      width: 1px;
      background: var(--line);
    }
    .dot {
      position: relative;
      z-index: 1;
      width: 9px;
      height: 9px;
      margin-top: 23px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px var(--bg);
    }
    .topic-row[data-status="completed"] .dot { background: var(--focus); }
    .topic-row[data-status="paused"] .dot { background: var(--amber); }
    .topic-row[data-status="archived"] .dot { background: var(--muted); }
    .topic-title { min-width: 0; }
    .topic-title strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }
    .topic-id {
      display: block;
      margin-top: 7px;
      overflow: hidden;
      color: var(--muted);
      font: 11px/1.2 "Cascadia Code", Consolas, monospace;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topic-state { min-width: 0; color: #3d4843; }
    .topic-state p {
      margin: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topic-state small {
      display: block;
      margin-top: 7px;
      overflow: hidden;
      color: var(--muted);
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .row-actions { display: flex; align-items: center; gap: 8px; }
    .pending {
      min-width: 28px;
      padding: 4px 7px;
      border-radius: 999px;
      background: var(--amber-soft);
      color: var(--amber);
      font-size: 12px;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }
    .select-topic {
      min-width: 58px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }
    .select-topic:hover { border-color: var(--green); color: var(--green); }
    .select-topic[aria-pressed="true"] {
      border-color: var(--green);
      background: var(--green-soft);
      color: var(--green);
      font-weight: 650;
    }
    .open-graph {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 17px;
    }
    .open-graph:hover { border-color: var(--focus); color: var(--focus); }
    .settings-section { padding: 18px 0; border-bottom: 1px solid var(--line); }
    .settings-section:first-of-type { padding-top: 16px; }
    .field-label {
      display: block;
      margin-bottom: 9px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .stack { display: grid; gap: 9px; }
    .text-input {
      width: 100%;
      height: 36px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
    }
    .number-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .connection-state { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .connection-state.real { color: var(--green); }
    .connection-state.error { color: var(--coral); }
    .toggle-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      cursor: pointer;
    }
    .toggle-copy strong { display: block; font-size: 13px; }
    .toggle-copy small { display: block; margin-top: 4px; color: var(--muted); line-height: 1.4; }
    .switch {
      position: relative;
      width: 42px;
      height: 24px;
      flex: 0 0 auto;
    }
    .switch input {
      position: absolute;
      z-index: 2;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      opacity: 0;
      cursor: pointer;
    }
    .switch-track {
      display: block;
      width: 42px;
      height: 24px;
      border-radius: 12px;
      background: var(--line);
      transition: background 140ms ease;
    }
    .switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 1px 3px rgba(23, 32, 28, 0.24);
      transition: transform 140ms ease;
    }
    .switch input:checked + .switch-track { background: var(--green); }
    .switch input:checked + .switch-track::after { transform: translateX(18px); }
    .switch input:focus-visible + .switch-track { outline: 2px solid var(--focus); outline-offset: 2px; }
    .usage-actions { display: flex; gap: 8px; }
    .usage-actions .command { flex: 1; }
    .secondary-small { height: 36px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); color: var(--muted); cursor: pointer; }
    .segmented {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 1fr;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .segmented button {
      height: 34px;
      border: 0;
      border-right: 1px solid var(--line);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }
    .segmented button:last-child { border-right: 0; }
    .segmented button.active { background: var(--green-soft); color: var(--green); font-weight: 650; }
    .intervals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .intervals button, .custom-interval {
      height: 34px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
    }
    .intervals button { cursor: pointer; }
    .intervals button.active { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); font-weight: 650; }
    .custom-wrap { display: grid; grid-template-columns: 1fr auto; gap: 6px; margin-top: 7px; }
    .custom-interval { width: 100%; padding: 0 9px; }
    .apply-custom {
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
    }
    .selection-name { margin: 0; line-height: 1.5; }
    .backfill-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
    .backfill-jobs { display: grid; gap: 8px; margin-top: 10px; }
    .backfill-job { padding-top: 8px; border-top: 1px solid var(--line); }
    .backfill-job strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
    .backfill-job small { display: block; margin-top: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .empty { padding: 48px 10px; color: var(--muted); text-align: center; border-bottom: 1px solid var(--line); }
    dialog {
      width: min(440px, calc(100vw - 32px));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0;
      color: var(--ink);
      box-shadow: 0 18px 60px rgba(23, 32, 28, 0.18);
    }
    dialog::backdrop { background: rgba(23, 32, 28, 0.34); }
    .dialog-body { padding: 22px; }
    .dialog-body h2 { margin: 0 0 20px; font-size: 17px; }
    .form-field { display: block; margin-bottom: 14px; }
    .form-field span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
    .form-field input {
      width: 100%;
      height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 0 10px;
    }
    .check { display: flex; align-items: center; gap: 8px; margin: 4px 0 20px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .secondary {
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
    }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      max-width: calc(100vw - 32px);
      padding: 10px 14px;
      border-radius: var(--radius);
      background: var(--ink);
      color: white;
      transform: translate(-50%, 18px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }
    .toast.error { background: var(--coral); }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; }
      aside { order: -1; border-left: 0; border-bottom: 1px solid var(--line); }
      .topic-row { grid-template-columns: 20px minmax(130px, 0.8fr) minmax(150px, 1.2fr) auto; }
    }
    @media (max-width: 580px) {
      .app-header { height: 56px; padding: 0 16px; }
      main, aside { padding: 18px 16px 28px; }
      .toolbar { flex-wrap: wrap; }
      .toolbar h2 { width: auto; }
      .search { order: 3; width: 100%; }
      .topic-row { grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; }
      .topic-state { grid-column: 2 / 4; padding-bottom: 4px; }
      .row-actions { grid-column: 3; grid-row: 1; }
    }
    @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="brand"><h1>Context Tree</h1><span class="local-mark">Local</span></div>
    <span id="save-state" class="count">已连接</span>
  </header>
  <div class="shell">
    <main>
      <div class="toolbar">
        <h2>主题</h2>
        <span id="topic-count" class="count">0</span>
        <div class="spacer"></div>
        <input id="search" class="search" type="search" placeholder="搜索主题" aria-label="搜索主题">
        <button id="new-topic" class="command" type="button">新建主题</button>
      </div>
      <div id="topic-list" class="topic-list" aria-live="polite"></div>
    </main>
    <aside>
      <h2>设置</h2>
      <section class="settings-section">
        <span class="field-label">真实会话用量</span>
        <div class="stack">
          <input id="usage-server" class="text-input" type="url" placeholder="https://example.com" aria-label="用量服务器地址">
          <input id="usage-key" class="text-input" type="password" autocomplete="off" placeholder="API Key（留空则保留）" aria-label="API Key">
          <input id="usage-capacity" class="text-input" type="number" min="16000" max="2000000" step="1000" placeholder="回退容量（本机无数据时）" aria-label="本机没有模型容量记录时使用的回退容量">
          <div class="number-row">
            <input id="usage-warning" class="text-input" type="number" min="10" max="99" aria-label="黄色阈值百分比" placeholder="黄色 %">
            <input id="usage-critical" class="text-input" type="number" min="11" max="100" aria-label="红色阈值百分比" placeholder="红色 %">
          </div>
          <p id="usage-state" class="connection-state">读取中</p>
          <div class="usage-actions"><button id="save-usage" class="command" type="button">保存并测试</button><button id="clear-key" class="secondary-small" type="button">清除 Key</button></div>
        </div>
      </section>
      <section class="settings-section">
        <span class="field-label">历史记忆补录</span>
        <div class="backfill-row">
          <input id="backfill-session" class="text-input" type="text" autocomplete="off" placeholder="粘贴会话 ID" aria-label="需要补录的 Codex 会话 ID">
          <button id="start-backfill" class="command" type="button">AI 补齐记忆</button>
        </div>
        <div id="backfill-jobs" class="backfill-jobs" aria-live="polite"></div>
      </section>
      <section class="settings-section">
        <label class="toggle-row" for="float-persistent">
          <span class="toggle-copy">
            <strong>悬浮按钮常驻</strong>
            <small id="float-persistent-state">空闲时自动隐藏</small>
          </span>
          <span class="switch">
            <input id="float-persistent" type="checkbox" role="switch">
            <span class="switch-track" aria-hidden="true"></span>
          </span>
        </label>
      </section>
      <section class="settings-section">
        <span class="field-label">路由方式</span>
        <div class="segmented" aria-label="路由方式">
          <button id="mode-auto" type="button">自动</button>
          <button id="mode-sticky" type="button">固定主题</button>
        </div>
      </section>
      <section class="settings-section">
        <span class="field-label">整理频率</span>
        <div id="intervals" class="intervals">
          <button type="button" data-value="1">1</button>
          <button type="button" data-value="2">2</button>
          <button type="button" data-value="3">3</button>
          <button type="button" data-value="5">5</button>
        </div>
        <div class="custom-wrap">
          <input id="custom-interval" class="custom-interval" type="number" min="1" max="50" placeholder="自定义 1-50" aria-label="自定义整理频率">
          <button id="apply-custom" class="apply-custom" type="button">应用</button>
        </div>
      </section>
      <section class="settings-section">
        <span class="field-label">当前主题</span>
        <p id="selection-name" class="selection-name">自动判断</p>
      </section>
    </aside>
  </div>
  <dialog id="topic-dialog">
    <form id="topic-form" class="dialog-body" method="dialog">
      <h2>新建主题</h2>
      <label class="form-field"><span>名称</span><input id="topic-title" required maxlength="100"></label>
      <label class="form-field"><span>目标</span><input id="topic-summary" maxlength="500"></label>
      <label class="check"><input id="select-created" type="checkbox" checked>创建后固定到此主题</label>
      <div class="dialog-actions">
        <button id="cancel-dialog" class="secondary" type="button">取消</button>
        <button class="command" type="submit">创建</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const TOKEN = "__CONTEXT_TREE_TOKEN__";
    let state = { config: {}, topics: [] };
    let backfillSignature = "";
    const $ = (id) => document.getElementById(id);

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: { "Content-Type": "application/json", "X-Context-Tree-Token": TOKEN, ...(options.headers || {}) },
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "操作失败");
      return data;
    }

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = value || "";
      return div.innerHTML;
    }

    function toast(message, error = false) {
      const node = $("toast");
      node.textContent = message;
      node.className = `toast show${error ? " error" : ""}`;
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => { node.className = "toast"; }, 1800);
    }

    function selectedTopic() {
      return state.topics.find((topic) => topic.id === state.config.sticky_topic_id);
    }

    function render() {
      const mode = state.config.routing_mode || "auto";
      $("mode-auto").classList.toggle("active", mode === "auto");
      $("mode-sticky").classList.toggle("active", mode === "sticky");
      const selected = selectedTopic();
      $("selection-name").textContent = mode === "auto" ? "自动判断" : (selected?.title || "未选择");
      document.querySelectorAll("#intervals button").forEach((button) => {
        button.classList.toggle("active", Number(button.dataset.value) === Number(state.config.consolidate_every));
      });
      const usage = state.usage || {};
      const floatPersistent = Boolean(state.config.float_persistent);
      $("float-persistent").checked = floatPersistent;
      $("float-persistent-state").textContent = floatPersistent ? "始终保留折叠按钮" : "空闲时自动隐藏";
      const connection = usage.connection || {};
      $("usage-server").value = connection.server_url || state.config.usage_server_url || "";
      $("usage-capacity").value = connection.capacity_tokens || state.config.usage_context_window_tokens || 272000;
      $("usage-warning").value = connection.warning_percent || 72;
      $("usage-critical").value = connection.critical_percent || 88;
      $("usage-key").placeholder = connection.api_key_configured ? `已保存 ${connection.api_key_hint}（留空则保留）` : "API Key";
      const usageState = $("usage-state");
      usageState.className = `connection-state ${usage.error ? "error" : usage.mode === "real" ? "real" : ""}`;
      usageState.textContent = usage.error ? `${usage.error}；正在使用本地估算` : usage.mode === "real" ? `连接正常，读取到 ${(usage.sessions || []).length} 个独立会话` : "未配置 Key，正在使用本地估算";
      const backfillJobs = state.backfill?.jobs || [];
      const statusNames = { queued: "等待 AI 整理", processing: "AI 整理中", completed: "已完成", error: "出错" };
      $("backfill-jobs").innerHTML = backfillJobs.slice(0, 3).map((job) => `
        <div class="backfill-job">
          <strong>${escapeHtml(job.session_title || job.session_id)}</strong>
          <small>${job.processed_items} / ${job.total_items} 轮 · ${statusNames[job.status] || job.status}</small>
        </div>`).join("");
      const query = $("search").value.trim().toLowerCase();
      const topics = state.topics.filter((topic) => `${topic.title} ${topic.summary} ${topic.id}`.toLowerCase().includes(query));
      $("topic-count").textContent = `${topics.length} / ${state.topics.length}`;
      if (!topics.length) {
        $("topic-list").innerHTML = `<div class="empty">${state.topics.length ? "没有匹配的主题" : "还没有主题"}</div>`;
        return;
      }
      $("topic-list").innerHTML = topics.map((topic) => {
        const active = mode === "sticky" && topic.id === state.config.sticky_topic_id;
        const stateText = topic.current_state || topic.summary || "尚无状态快照";
        const nextText = topic.next_action ? `下一步：${topic.next_action}` : "";
        return `<article class="topic-row" data-status="${escapeHtml(topic.status)}">
          <div class="rail"><span class="dot"></span></div>
          <div class="topic-title"><strong>${escapeHtml(topic.title)}</strong><span class="topic-id">${escapeHtml(topic.id)}</span></div>
          <div class="topic-state"><p>${escapeHtml(stateText)}</p><small>${escapeHtml(nextText)}</small></div>
          <div class="row-actions">${topic.pending_count ? `<span class="pending" title="待整理 Turn">${topic.pending_count}</span>` : ""}<button class="open-graph" type="button" data-graph="${escapeHtml(topic.id)}" title="打开记忆树" aria-label="打开 ${escapeHtml(topic.title)} 的记忆树">&#8599;</button><button class="select-topic" type="button" data-topic="${escapeHtml(topic.id)}" aria-pressed="${active}">${active ? "已固定" : "固定"}</button></div>
        </article>`;
      }).join("");
    }

    async function updateRouting(mode, topicId = null, every = state.config.consolidate_every || 3) {
      $("save-state").textContent = "保存中";
      state = await api("/api/routing", {
        method: "POST",
        body: JSON.stringify({ mode, topic_id: topicId, every: Number(every) }),
      });
      $("save-state").textContent = "已保存";
      render();
    }

    async function saveUsage(clear = false) {
      const body = {
        server_url: $("usage-server").value.trim(),
        capacity_tokens: Number($("usage-capacity").value),
        warning_percent: Number($("usage-warning").value),
        critical_percent: Number($("usage-critical").value),
        clear_api_key: clear,
      };
      if ($("usage-key").value.trim()) body.api_key = $("usage-key").value.trim();
      $("save-state").textContent = "连接中";
      state = await api("/api/usage-settings", { method: "POST", body: JSON.stringify(body) });
      $("usage-key").value = "";
      $("save-state").textContent = state.usage?.mode === "real" ? "真实数据" : "本地估算";
      render();
    }

    $("mode-auto").addEventListener("click", async () => {
      try { await updateRouting("auto"); toast("已启用自动路由"); } catch (error) { toast(error.message, true); }
    });
    $("save-usage").addEventListener("click", async () => {
      try { await saveUsage(false); toast(state.usage?.mode === "real" ? "连接成功" : "设置已保存"); } catch (error) { toast(error.message, true); }
    });
    $("clear-key").addEventListener("click", async () => {
      try { await saveUsage(true); toast("API Key 已清除"); } catch (error) { toast(error.message, true); }
    });
    $("float-persistent").addEventListener("change", async (event) => {
      const persistent = event.currentTarget.checked;
      $("save-state").textContent = "保存中";
      try {
        state = await api("/api/float-settings", {
          method: "POST", body: JSON.stringify({ persistent }),
        });
        $("save-state").textContent = "已保存";
        render();
        toast(persistent ? "悬浮按钮已设为常驻" : "悬浮按钮将在空闲时隐藏");
      } catch (error) {
        event.currentTarget.checked = !persistent;
        $("save-state").textContent = "保存失败";
        toast(error.message, true);
      }
    });
    $("start-backfill").addEventListener("click", async () => {
      const sessionId = $("backfill-session").value.trim();
      if (!sessionId) { toast("请输入会话 ID", true); return; }
      const button = $("start-backfill");
      button.disabled = true;
      $("save-state").textContent = "正在读取会话";
      try {
        const result = await api("/api/backfill", {
          method: "POST", body: JSON.stringify({ session_id: sessionId }),
        });
        state = result.state;
        $("backfill-session").value = "";
        $("save-state").textContent = "补录任务已建立";
        render();
        toast(`已读取 ${result.backfill_job.job.total_items} 轮`);
      } catch (error) {
        $("save-state").textContent = "会话读取失败";
        toast(error.message, true);
      } finally { button.disabled = false; }
    });
    $("mode-sticky").addEventListener("click", async () => {
      const topic = selectedTopic() || state.topics[0];
      if (!topic) { toast("请先新建主题", true); return; }
      try { await updateRouting("sticky", topic.id); toast(`已固定到 ${topic.title}`); } catch (error) { toast(error.message, true); }
    });
    $("topic-list").addEventListener("click", async (event) => {
      const graphButton = event.target.closest("[data-graph]");
      if (graphButton) {
        window.open(`/graph?topic=${encodeURIComponent(graphButton.dataset.graph)}`, "_blank", "noopener");
        return;
      }
      const button = event.target.closest("[data-topic]");
      if (!button) return;
      const topic = state.topics.find((item) => item.id === button.dataset.topic);
      try { await updateRouting("sticky", topic.id); toast(`已固定到 ${topic.title}`); } catch (error) { toast(error.message, true); }
    });
    $("intervals").addEventListener("click", async (event) => {
      const button = event.target.closest("[data-value]");
      if (!button) return;
      try { await updateRouting(state.config.routing_mode || "auto", state.config.sticky_topic_id, Number(button.dataset.value)); toast(`每 ${button.dataset.value} 轮整理`); } catch (error) { toast(error.message, true); }
    });
    $("apply-custom").addEventListener("click", async () => {
      const value = Number($("custom-interval").value);
      if (!Number.isInteger(value) || value < 1 || value > 50) { toast("请输入 1-50", true); return; }
      try { await updateRouting(state.config.routing_mode || "auto", state.config.sticky_topic_id, value); toast(`每 ${value} 轮整理`); } catch (error) { toast(error.message, true); }
    });
    $("search").addEventListener("input", render);
    $("new-topic").addEventListener("click", () => { $("topic-dialog").showModal(); $("topic-title").focus(); });
    $("cancel-dialog").addEventListener("click", () => $("topic-dialog").close());
    $("topic-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        state = await api("/api/topics", {
          method: "POST",
          body: JSON.stringify({
            title: $("topic-title").value,
            summary: $("topic-summary").value,
            select: $("select-created").checked,
          }),
        });
        $("topic-form").reset();
        $("select-created").checked = true;
        $("topic-dialog").close();
        render();
        toast("主题已创建");
      } catch (error) { toast(error.message, true); }
    });

    api("/api/state").then((data) => {
      state = data;
      backfillSignature = JSON.stringify(state.backfill || {});
      render();
    }).catch((error) => toast(error.message, true));
    setInterval(async () => {
      try {
        const backfill = await api("/api/backfill");
        const signature = JSON.stringify(backfill);
        if (signature !== backfillSignature) {
          backfillSignature = signature;
          state = await api("/api/state");
          render();
        }
      } catch (_error) { /* next poll retries */ }
    }, 3000);
  </script>
</body>
</html>
